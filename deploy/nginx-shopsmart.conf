# Public entry point. Only ports 80 and 443 are open in the security group.
server {
    listen 80;
    server_name __SERVER_NAME__;

    root /opt/shopsmart/frontend/dist;
    index index.html;

    # API: forwarded to Express, which listens only on 127.0.0.1:3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Built assets have hashed names, so they can be cached
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Single-page app: a refresh on /orders/12 or /cart still loads index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
