# ShopSmart single-host site. Nginx is the only public entry point.
# 02-release.sh copies frontend/dist to /var/www/shopsmart.
# Certbot (--nginx) adds the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/shopsmart;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    # API: forwarded to Express, which listens only on 127.0.0.1:3000 (never exposed publicly).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed Vite build files can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: direct visits and refreshes of React routes (e.g. /orders/3) get index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
