<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="Segoe UI, Arial, sans-serif">
  <title>ShopSmart planned staging deployment</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowPriv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1040" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">ShopSmart: planned staging deployment</text>
  <text x="40" y="70" font-size="14" fill="#475569">Plan only. Hosting platforms are not chosen yet. Platform-specific steps are to be confirmed with the approved platform.</text>

  <!-- Browser -->
  <rect x="40" y="250" width="200" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="140" y="285" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Browser</text>
  <text x="140" y="310" font-size="13" text-anchor="middle" fill="#334155">Instructor / tester</text>
  <text x="140" y="330" font-size="13" text-anchor="middle" fill="#334155">(private staging,</text>
  <text x="140" y="348" font-size="13" text-anchor="middle" fill="#334155">fictional data only)</text>

  <!-- Static hosting -->
  <rect x="390" y="110" width="290" height="150" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="535" y="140" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Static hosting service</text>
  <text x="535" y="162" font-size="13" text-anchor="middle" fill="#334155">Vite build: frontend/dist</text>
  <text x="405" y="192" font-size="12.5" fill="#0f172a" font-weight="700">Config (public, set at build time):</text>
  <text x="405" y="212" font-size="12.5" fill="#334155">VITE_API_URL = https://&lt;api-host&gt;/api</text>
  <text x="405" y="236" font-size="12.5" fill="#334155">Needs: all paths rewrite to index.html</text>

  <!-- API -->
  <rect x="390" y="330" width="290" height="230" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="535" y="360" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Node.js hosting service</text>
  <text x="535" y="382" font-size="13" text-anchor="middle" fill="#334155">Express API (backend/), Node 22</text>
  <text x="535" y="402" font-size="13" text-anchor="middle" fill="#334155">Health: https://&lt;api-host&gt;/api/health</text>
  <text x="405" y="430" font-size="12.5" fill="#0f172a" font-weight="700">Secrets (server only):</text>
  <text x="405" y="449" font-size="12.5" fill="#334155">DATABASE_URL, GEMINI_API_KEY</text>
  <text x="405" y="475" font-size="12.5" fill="#0f172a" font-weight="700">Config (not secret):</text>
  <text x="405" y="494" font-size="12.5" fill="#334155">FRONTEND_URL (CORS origin), NODE_ENV,</text>
  <text x="405" y="512" font-size="12.5" fill="#334155">PORT (from the platform),</text>
  <text x="405" y="530" font-size="12.5" fill="#334155">GEMINI_MODEL, GEMINI_TIMEOUT_MS</text>

  <!-- PostgreSQL -->
  <rect x="790" y="330" width="210" height="150" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="895" y="360" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Managed PostgreSQL</text>
  <text x="895" y="384" font-size="13" text-anchor="middle" fill="#334155">Database: shopsmart</text>
  <text x="895" y="408" font-size="12.5" text-anchor="middle" fill="#334155">Schema: npx prisma</text>
  <text x="895" y="426" font-size="12.5" text-anchor="middle" fill="#334155">migrate deploy</text>
  <text x="895" y="452" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="700">Never run db:seed here</text>

  <!-- Gemini -->
  <rect x="790" y="110" width="210" height="110" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="895" y="142" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Google Gemini API</text>
  <text x="895" y="166" font-size="13" text-anchor="middle" fill="#334155">External AI provider</text>
  <text x="895" y="188" font-size="12.5" text-anchor="middle" fill="#334155">Called only by the API,</text>
  <text x="895" y="206" font-size="12.5" text-anchor="middle" fill="#334155">never by the browser</text>

  <!-- Arrows -->
  <!-- Browser -> static -->
  <path d="M240,280 L388,200" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="250" y="188" font-size="12.5" fill="#0f172a" font-weight="700">1. HTTPS (internet)</text>
  <text x="250" y="205" font-size="12" fill="#475569">loads the page</text>

  <!-- Browser -> API -->
  <path d="M240,340 L388,420" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="400" font-size="12.5" fill="#0f172a" font-weight="700">2. HTTPS (internet)</text>
  <text x="50" y="418" font-size="12" fill="#475569">fetch to VITE_API_URL,</text>
  <text x="50" y="435" font-size="12" fill="#475569">CORS allows FRONTEND_URL</text>

  <!-- API -> PostgreSQL -->
  <path d="M680,420 L788,410" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowPriv)"/>
  <text x="684" y="398" font-size="12.5" fill="#0f766e" font-weight="700">3. TLS</text>
  <text x="684" y="440" font-size="12" fill="#0f766e">private link if</text>
  <text x="684" y="456" font-size="12" fill="#0f766e">the platform has one</text>

  <!-- API -> Gemini -->
  <path d="M640,330 L800,222" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="738" y="294" font-size="12.5" fill="#0f172a" font-weight="700">4. HTTPS (internet)</text>
  <text x="738" y="312" font-size="12" fill="#475569">key sent from server only</text>

  <!-- Legend -->
  <rect x="40" y="590" width="960" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="60" y1="618" x2="110" y2="618" stroke="#334155" stroke-width="2.5"/>
  <text x="120" y="623" font-size="13" fill="#0f172a">Solid line: crosses the public internet (HTTPS).</text>
  <line x1="520" y1="618" x2="570" y2="618" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="580" y="623" font-size="13" fill="#0f172a">Dashed line: server to database (private if possible).</text>
  <text x="60" y="652" font-size="13" fill="#334155">Secrets live only in the Node.js hosting service's secret settings. They are never in the repo, the Vite build, or the browser.</text>
  <text x="60" y="671" font-size="13" fill="#334155">VITE_API_URL is public: anyone can read it in the built JavaScript. That is fine because it is only an address.</text>
</svg>
