<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">ShopSmart on AWS – single EC2 host (ap-southeast-1, Singapore)</text>
  <text x="30" y="60" fill="#475569">https://18-140-130-174.sslip.io · code 446488d · Free plan account · fictional data, simulated checkout</text>

  <rect x="30" y="110" width="190" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="145" text-anchor="middle" font-weight="700">Browser</text>
  <text x="125" y="168" text-anchor="middle" fill="#334155">React app (Vite build)</text>
  <text x="125" y="188" text-anchor="middle" fill="#334155">httpOnly Secure cookie</text>

  <rect x="290" y="90" width="780" height="470" rx="14" fill="#f8fafc" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="118" font-weight="700" fill="#0f766e">EC2 shopsmart-demo · t3.micro · Ubuntu 24.04 · 20 GiB gp3</text>
  <text x="310" y="138" fill="#475569" font-size="13">Security group shopsmart-web-sg: 443 + 80 from anywhere · 22 from my IP only · 3000 and 5432 closed</text>

  <rect x="320" y="165" width="250" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="445" y="195" text-anchor="middle" font-weight="700">Nginx (public entry)</text>
  <text x="445" y="218" text-anchor="middle" fill="#334155">:443 HTTPS (Let's Encrypt)</text>
  <text x="445" y="238" text-anchor="middle" fill="#334155">:80 → redirect to HTTPS</text>
  <text x="445" y="258" text-anchor="middle" fill="#334155">/ → frontend/dist + SPA rewrite</text>
  <text x="445" y="278" text-anchor="middle" fill="#334155">/api/ → 127.0.0.1:3000</text>

  <rect x="640" y="165" width="250" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="765" y="195" text-anchor="middle" font-weight="700">Express API (Node 22)</text>
  <text x="765" y="218" text-anchor="middle" fill="#334155">127.0.0.1:3000 (internal)</text>
  <text x="765" y="238" text-anchor="middle" fill="#334155">systemd: start on boot, restart</text>
  <text x="765" y="258" text-anchor="middle" fill="#334155">sessions · order ownership</text>
  <text x="765" y="278" text-anchor="middle" fill="#334155">idempotent checkout · assistant</text>

  <rect x="640" y="375" width="250" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="765" y="405" text-anchor="middle" font-weight="700">PostgreSQL 16</text>
  <text x="765" y="428" text-anchor="middle" fill="#334155">127.0.0.1:5432 (internal)</text>
  <text x="765" y="448" text-anchor="middle" fill="#334155">Products · Users · Sessions · Orders</text>
  <text x="765" y="468" text-anchor="middle" fill="#334155">prisma migrate deploy (3 migrations)</text>
  <text x="765" y="488" text-anchor="middle" fill="#334155">pg_dump before each update</text>

  <rect x="320" y="375" width="250" height="140" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="445" y="405" text-anchor="middle" font-weight="700">Server-only settings</text>
  <text x="445" y="428" text-anchor="middle" fill="#334155">/etc/shopsmart/backend.env (640)</text>
  <text x="445" y="448" text-anchor="middle" fill="#334155">DATABASE_URL (random password)</text>
  <text x="445" y="468" text-anchor="middle" fill="#334155">COOKIE_SECURE · TRUST_PROXY</text>
  <text x="445" y="488" text-anchor="middle" fill="#334155">GEMINI_API_KEY empty (no AI)</text>

  <rect x="920" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="990" y="230" text-anchor="middle" font-weight="700" fill="#64748b">AI provider</text>
  <text x="990" y="252" text-anchor="middle" fill="#64748b" font-size="12">not configured</text>
  <text x="990" y="270" text-anchor="middle" fill="#64748b" font-size="12">(server-only if added)</text>

  <line x1="220" y1="165" x2="318" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="228" y="250" fill="#1d4ed8" font-weight="700">HTTPS 443</text>
  <line x1="570" y1="260" x2="638" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="575" y="250" fill="#334155" font-size="12">HTTP local</text>
  <line x1="765" y1="315" x2="765" y2="373" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="772" y="350" fill="#334155" font-size="12">TCP local</text>
  <line x1="890" y1="240" x2="918" y2="240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="30" y="600" fill="#334155">Only Nginx is reachable from the internet. The browser never connects to PostgreSQL or to an AI provider.</text>
  <text x="30" y="622" fill="#334155">Customer identity (ShopSmart sessions) is separate from AWS IAM, which only controls who manages AWS resources.</text>
</svg>
